[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptctl"
version = "0.1.0"
description = "Git for prompts. Version, diff, eval, and rollback LLM prompts like source code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "promptctl contributors" }]
keywords = ["llm", "prompts", "eval", "versioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "openai>=1.30",
    "anthropic>=0.28",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-PyYAML",
]

[project.scripts]
promptctl = "cli.main:app"

[project.urls]
Repository = "https://github.com/rbelateche/promptctl"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "evals*", "storage*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
